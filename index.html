<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Great Cliffs Home</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      #container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        background: url(images/central_park.jpg) 0 -200px no-repeat;
        background-size: 1500px;
        height: 400px;
        padding-top: 100px;
        padding-left: 100px;
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
        color: #fff;
      }

      .main-header {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .logo img {
        width: 125px;
      }

      nav {
        background-color: gray;
        text-align: center;
        padding-top: 10px;
      }

      nav ul {
        margin: 0;
        padding: 0;
      }

      li {
        list-style-type: none;
        display: inline;
      }

      a {
        padding: 10px;
        text-decoration: none;
        color: #fff;
      }

      a:link {
      }

      a:visited {
      }

      a:hover {
        color: #000;
        background-color: #ddd;
      }

      a:active {
        color: #ff0;
      }

      main {
        padding: 20px;
      }

      main h1 {
        color: blue;
        font-family: Arial, Helvetica, sans-serif;
      }

      footer {
        height: 50px;
        background-color: black;
        text-align: center;
        padding-top: 20px;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <header>
        <div class="main-header">
          <div class="logo">
            <img src="images/logo.png" alt="Great Cliffs Logo" width="125" />
          </div>
          <h1>My Web Site Brand</h1>
        </div>
      </header>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="activities.html">Activities</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>

      <main>
        <h1>Welcome to Great Cliffs</h1>
        <p>
          Great Cliffs offers amazing outdoor experiences including hiking,
          biking, camping, kayaking, and more. Explore our activities and enjoy
          nature at its best.
        </p>
      </main>

      <footer>
        <p>&copy; 2026 Great Cliffs. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
